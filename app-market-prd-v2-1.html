x;display:flex;align-items:center;justify-content:space-between;margin:12px 0 15px}.hero h3{font-size:21px;margin:5px 0;letter-spacing:-.6px}.hero p{font-size:12px;color:#71809f;margin:0}.app{width:100%;display:flex;align-items:center;gap:14px;padding:15px;text-align:left;border:1px solid var(--line);border-radius:15px;background:#fff;cursor:pointer}.app:hover{border-color:#a8b1f0;background:#fbfbff}.appicon{width:51px;height:51px;border-radius:15px;background:#eff0ff;display:grid;place-items:center;font-size:27px;flex:none}.app b{display:block;font-size:14px}.app p{margin:4px 0 0;color:var(--dim);font-size:12px}.app em{display:block;font-size:10px;color:var(--blue);font-style:normal;margin-top:7px}.field{padding:14px;border:1px solid var(--line);border-radius:15px;margin:10px 0}.field b{font-size:13px}.field small{display:block;font-size:11px;color:var(--dim);margin:4px 0 10px}.inp{width:100%;border:1px solid #dfe4f0;border-radius:11px;padding:11px 12px;background:white;color:var(--ink);min-height:41px}.inp.area{min-height:82px;resize:vertical}.file{display:block;text-align:center;background:#f7f8fe;border:1px dashed #a9b4dd;border-radius:11px;padding:16px;color:#5868ad;font-size:12px}.file input{display:block;width:100%;font-size:11px;margin-top:9px}.choice{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:11px;padding:9px 10px;margin:7px 0;font-size:12px}.choice.on{border-color:#9ba7ee;background:#f3f4ff}.consent{display:flex;gap:9px;color:#586581;font-size:12px;margin:14px 0;align-items:flex-start}.consent input{accent-color:var(--blue);margin-top:4px}.price{border:1px solid #dfe5fc;background:#f4f6ff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;margin:13px 0}.price strong{color:#3f4cc0;font-size:16px}.stage{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:13px;margin-top:9px}.stage i{width:32px;height:32px;border-radius:10px;background:#edf0ff;display:grid;place-items:center;color:#5b6acc;font-weight:800;font-style:normal}.stage b{font-size:12px}.stage small{display:block;color:var(--dim);font-size:11px}.video{background:linear-gradient(135deg,#1b2543,#6069a6);height:225px;border-radius:16px;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;gap:10px}.face{width:91px;height:91px;border-radius:50%;border:3px solid #ffffff33;background:#ffffff16;display:grid;place-items:center;font-size:53px}.watermark{position:absolute;top:11px;right:11px;font-size:10px;background:#ffffff33;padding:4px 7px;border-radius:30px}.opbtn{display:flex;gap:12px;width:100%;text-align:left;align-items:center;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;margin:8px 0}.opbtn.active{border-color:#929ff1;background:#f4f5ff}.opnum{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:#eef0ff;color:#4055cb;font-weight:800}.opbtn b{font-size:13px;display:block}.opbtn small{display:block;font-size:11px;color:var(--dim)}.scenario{width:100%;text-align:left;border:1px solid var(--line);padding:11px 12px;border-radius:11px;background:#fff;font-size:12px;margin:4px 0}.scenario.on{background:#eef1ff;border-color:#8797ed}.gate{border:1px solid var(--line);padding:12px;border-radius:12px;margin:9px 0}.gate b{font-size:12px}.gate p{font-size:12px;color:var(--dim);margin:5px 0}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{border:1px solid var(--line);padding:13px;border-radius:13px}.stat strong{font-size:21px;color:var(--blue);display:block}.stat span{font-size:11px;color:var(--dim)}.story{background:white;border:1px solid var(--line);border-radius:15px;padding:18px;margin-top:11px}.story h3{font-size:15px;margin:7px 0}.story p{font-size:12px;color:var(--dim);margin:5px 0}.rubric{width:100%;border-collapse:collapse;font-size:12px}.rubric td,.rubric th{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}.rubric th{background:#f6f7fe;color:#677493}.footer{border-top:1px solid var(--line);padding-top:18px;margin-top:46px;color:#919bb0;font-size:11px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#263353;color:#fff;padding:12px 15px;border-radius:11px;box-shadow:0 8px 30px #1726443b;font-size:12px;z-index:15;display:none;max-width:90%}.toast.show{display:block}
@media(max-width:880px){.grid{grid-template-columns:1fr}.top-inner{padding:10px 13px;gap:8px}.nav{width:100%;overflow-x:auto;justify-content:space-between}.nav button{flex:1;padding:8px 5px;font-size:11px}.version{margin-left:auto}.card{padding:17px}main{padding:23px 13px 50px}.body{padding:13px}.hero{padding:15px}.hero h3{font-size:18px}.three{grid-template-columns:1fr}.title{font-size:30px}}@media(max-width:380px){.nav button{font-size:10px}.brand{font-size:17px}.version{font-size:10px}}


.repair-summary{background:linear-gradient(120deg,#eef1ff,#f9faff);border:1px solid #dfe3fa;border-radius:16px;padding:17px;margin:14px 0}
.repair-summary strong{display:block;font-size:19px;letter-spacing:-.4px}.repair-summary p{margin:6px 0 0;font-size:12px;color:#62739b}
.fix-list{display:grid;gap:9px;margin:14px 0}

.fix-badge.configured{color:#276d52;background:#e9f8ef}.fix-badge.developer{color:#6d56a3;background:#f2edff}

.fix-panel select,.fix-panel input:not([type="checkbox"]),.fix-panel textarea{width:100%;max-width:100%;font:inherit;font-size:13px;border:1px solid #d9e1f3;background:#fff;border-radius:10px;padding:10px;min-height:40px}
.fix-panel textarea{min-height:90px;resize:vertical}

.fix-sequence button{margin-top:6px}

<body><header class="topbar"><div class="top-inner"><div class="brand"><span class="glyph">✦</span>Astra <small>APP MARKET</small></div><span class="version">产品体验 PRD V2.1 · 待审核</span><nav class="nav" id="nav"><button data-tab="consumer">消费者体验</button><button data-tab="operator">运营调试工坊</button><button data-tab="stories">用户故事</button><button data-tab="criteria">上架验收</button></nav></div></header>
<main><div id="view"></div><div class="footer">Astra App Market · V2.1 · 2026-10-31 · 本网页所有生成、价格、工具、录音、评测、订单均为交互模拟，非生产能力声明。不会调用任何生产 API。</div></main><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const APPS={
  video:{name:'定制照片口播视频',emoji:'🎬',desc:'给一张照片、一段声音、一段话，让人物自然口播',price:'¥19.9 / 次（示例）',fields:[{id:'portrait',type:'image',label:'一张人物照片',hint:'正面清晰；可拍照或从相册选',required:true},{id:'voice',type:'voice',label:'声音',hint:'默认系统音色；定制本人音色需要授权及实际质量检测',required:true},{id:'script',type:'script',label:'口播脚本',hint:'输入内容或让 AI 帮忙起草',required:true}],consent:true},
  copy:{name:'商品卖点文案',emoji:'✍️',desc:'填入商品事实，生成可修改的卖点文案',price:'¥3.9 / 次（示例）',fields:[{id:'facts',type:'script',label:'商品真实信息',hint:'名称、用途、规格和禁用表述',required:true},{id:'audience',type:'text',label:'目标用户',hint:'选填：例如办公人群',required:false}],consent:false}
};
const CASES=[
['完整流程','照片/声音/脚本 → 平台组件取值 → Tool 执行 → 视频 Artifact → 可下载','未跑通平台真实外部视频工具'],
['缺少素材','用户缺一项时，只补问缺项并保留已填写内容','需用动态 Skill UI 实测缺项恢复'],
['授权不足','无肖像/声音使用权时明确拒绝，无实质生成与扣费','真实权限与授权校验尚待对接'],
['工具失败','超时/低质量可查看原因、重试，权益按规则返还','须真实工具失败演练和记录'],
['成本交付','上游成本可归集，用户售价可见，成功可下载、失败可返还','权益与 Artifact 商业闭环尚待验收']
];
let S={tab:'consumer',app:'video',screen:'list',data:{video:{voice:'system'},copy:{}},consent:false,edit:0,op:0,uploaded:false,case:0,played:false,issue:false};
const root=document.getElementById('view');
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function button(action,text,cls,extra){return '<button type="button" data-action="'+action+'" class="btn '+(cls||'')+'" '+(extra||'')+'>'+text+'</button>';}
function message(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(message.timer);message.timer=setTimeout(()=>el.classList.remove('show'),3000);}
function render(){document.querySelectorAll('[data-tab]').forEach(n=>n.classList.toggle('active',n.dataset.tab===S.tab));root.innerHTML=S.tab==='consumer'?consumer():S.tab==='operator'?operator():S.tab==='stories'?stories():criteria();}
function consumer(){
 const cap=APPS[S.app],v=S.data[S.app],screen=S.screen;
 let inner='';
 if(screen==='list'){
  inner='<div class="hero"><div><span class="kicker">发现好用的数字员工</span><h3>选一件你想完成的事</h3><p>不用先写 Prompt，打开就能做。</p></div><span style="font-size:40px">✨</span></div><div class="stack">'+Object.keys(APPS).map(k=>'<button type="button" class="app" data-action="choose" data-id="'+k+'"><span class="appicon">'+APPS[k].emoji+'</span><span><b>'+APPS[k].name+'</b><p>'+APPS[k].desc+'</p><em>只提供必要素材 → 自动完成 → 可修改</em></span><span style="margin-left:auto">›</span></button>').join('')+'</div>';
 }else if(screen==='form'){
  inner='<div class="row">'+button('backList','← 换一个应用','soft')+'</div><div class="hero"><div><span class="kicker">向导式任务组件</span><h3>'+cap.emoji+' '+cap.name+'</h3><p>缺什么补什么，不要求用户学会对话。</p></div></div>';
  inner+=cap.fields.map(f=>field(f,v)).join('');
  if(cap.consent)inner+='<label class="consent"><input id="consent" type="checkbox" '+(S.consent?'checked':'')+'><span>我确认有权使用上述照片与声音。若创建个人音色，须按照要求完成本人或权利人授权验证。</span></label>';
  inner+='<div class="price"><span>确认前显示本次价格和权益（模拟）</span><strong>'+cap.price+'</strong></div><div class="row">'+button('start','确认并开始制作 →','primary')+'</div><p class="sub">演示不调用麦克风、模型、支付或外部视频服务。</p>';
 }else if(screen==='running'){
  inner='<div class="hero"><div><span class="kicker">模拟生成中</span><h3>正在完成'+cap.name+'</h3><p>真实进度由 Work Journal / Tool evidence 回读，离开页面也可继续。</p></div>⏳</div>';
  inner+=['已接收素材（模拟）','平台 Skill 与 Tool 正在工作（演示）','成果待归档','权益将在真实规则下结算'].map((x,i)=>'<div class="stage"><i>'+(i+1)+'</i><div><b>'+x+'</b></div></div>').join('');
  inner+='<div class="row" style="margin-top:15px">'+button('finish','查看模拟结果 →','primary')+button('edit','修改输入','soft')+'</div>';
 }else if(screen==='result'){
  inner='<div class="row">'+button('edit','← 修改素材','soft')+'</div><div class="hero"><div><span class="kicker">成果页</span><h3>输出可以直接修改</h3><p>结果应可回看、可下载、可继续交代修改。</p></div></div>';
  inner+='<div class="video"><span class="watermark">Demo · 非真实视频</span><div class="face">'+(S.app==='video'?'👩':'📝')+'</div><small>这里应呈现真实成果 Artifact</small></div>';
  inner+='<div class="field"><b>成果内容与再编辑</b><small>直接编辑，也可以向员工描述想要的变化。</small><textarea id="editedText" class="inp area">'+esc(v.script||v.facts||'')+'</textarea></div><div class="row">'+button('redo','按修改重新制作','primary')+button('download','下载演示说明','soft')+button('restart','再做一次','soft')+'</div><div class="notice" style="margin-top:12px">这是 UI 模拟，不代表已生成视频或已扣费。真实发布必须能验证视频文件、成本、历史与失败返还。</div>';
 }
 const order=screen==='list'?0:screen==='result'?2:1;
 return '<div class="kicker">Astra App Market / consumer</div><h1 class="title">让用户做成事情，<br>而不是教用户提问。</h1><p class="intro">主交互是“应用卡片 → 必需输入 → 成果”，对话负责答疑、补全和修改；不为每个行业硬编码独立表单。</p><div class="grid"><aside class="card"><span class="pill">统一规则 · Capability UI Contract</span><h2 style="font-size:18px;margin:15px 0 5px">任务优先，对话辅助</h2><p class="sub">这套演示从两份能力 Schema 生成不同输入组件，底层仍是 Astra Employee / Skill / Tool / Artifact。</p><div class="steps">'+['选应用','提供素材','拿到成果'].map((x,i)=>'<span class="step '+(order===i?'active':order>i?'done':'')+'">'+(i+1)+' '+x+'</span>').join('')+'</div><div class="sideitem"><b>首次体验：自动生成输入卡片</b><p>口播视频是照片、音色、脚本；其他应用由自身的 Schema 产生字段，不套统一聊天框。</p></div><div class="sideitem"><b>遇到缺输入：只询问当前缺项</b><p>不重复收集资料，素材可复用，输入卡片可来自 Agent 当前分析。</p></div><div class="sideitem"><b>交付后：局部修改 + 语音/文字沟通</b><p>编辑文案后重新生成，也可说“讲得活泼一点”。只有实际视频、文本或表格 Artifact 才算成功。</p></div><div class="notice" style="margin-top:13px">“读一句话拿音色”是目标交互，不保证单句必然足够。录音不合格时智能提示补录，并完成明确授权。</div></aside><section class="window"><div class="head"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span style="margin-left:auto">消费者手机模拟 · 可点击</span></div><div class="body">'+inner+'</div></section></div>';
}
function field(f,v){

else if(a==='record'){S.data[S.app].voice='sample';message('仅模拟录音结果，不读取麦克风或上传音色')}
else if(a==='suggest'){S.data[S.app][S.app==='video'?'script':'facts']=S.app==='video'?'大家好，欢迎来到我的小店。今天为大家介绍这款适合日常使用的新品！':'手工陶瓷杯，容量300毫升，适合日常喝水使用。价格请以商品页为准。'}
else if(a==='start'){let v=S.data[S.app],f=APPS[S.app].fields.find(x=>x.required&&!v[x.id]);if(f){message('还差一步：'+f.label);return}if(APPS[S.app].consent&&!S.consent){message('请确认人物照片及声音的使用权');return}S.screen='running'}
else if(a==='finish')S.screen='result';
else if(a==='redo'){const x=document.getElementById('editedText');S.data[S.app][S.app==='video'?'script':'facts']=x.value;S.edit++;S.screen='running'}
else if(a==='restart')S.screen='form';
else if(a==='download'){const t='Astra PRD 模拟成果说明（非真实交付）\n'+APPS[S.app].name+'\n'+JSON.stringify(S.data[S.app],null,2);const u=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));const link=document.createElement('a');link.href=u;link.download='Astra-PRD-模拟说明.txt';link.click();setTimeout(()=>URL.revokeObjectURL(u),1500);message('已生成演示说明');return}
else if(a==='opstep')S.op=Number(b.dataset.index);
else if(a==='load'){S.uploaded=true;message('示例 Skill 已载入，非真实上传')}
else if(a==='debug')S.op=1;
else if(a==='case')S.case=Number(b.dataset.index);
else if(a==='simulate'){S.played=true;message('仅模拟调试界面，不产生真实运行证据')}
else if(a==='review')S.op=2;
else if(a==='fixes'){S.op=2;S.focusFix='tool';}
else if(a==='returnDebug'){S.op=1;S.focusFix='tool';}
else if(a==='goFix'){S.tab='operator';S.op=2;S.focusFix='tool';history.replaceState(null,'','#operator');scrollTo({top:0});}
else if(a==='openFix'){S.focusFix=b.dataset.fix;S.devTicket=false;S.toolCheck='';S.trialMessage='';}
else if(a==='nextFix'){const ids=['tool','ui','trial','artifact','pricing'];S.focusFix=ids[(ids.indexOf(S.focusFix)+1)%ids.length];S.devTicket=false;}
else if(a==='needsDev'){if(S.focusFix==='tool' && S.toolProvider==='unsupported'){S.devTicket=true;S.fixState ||= {};S.fixState.tool='developer';}else{message('该项已有平台内修复入口，请先完成授权、绑定或调试；仅确认缺少底层能力才升级研发。');return;}}
else if(a==='closeTicket'){S.devTicket=false;}
else if(a==='downloadTicket'){const blob=new Blob([S.devTicketText||'研发支持单示例'],{type:'text/plain;charset=utf-8'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='Astra-研发支持单-演示.txt';l.click();setTimeout(()=>URL.revokeObjectURL(u),1500);message('已导出研发支持材料示例（不创建正式工单）');return;}
else if(a==='autoDiagnose'){S.fixState ||= {};S.fixState.ui='configured';S.autoDiagnosed=true;S.focusFix='tool';message('已模拟生成组件映射与评测场景，接下来处理账号授权和真实执行');}
else if(a==='authorizeTool'){S.toolProvider='connected';S.toolCheck='演示授权已完成；正式产品须通过 Astra Connection 与权限体系取回真实凭证，再次测试连接。';S.fixState ||= {};S.fixState.tool='configured';}
else if(a==='testTool'){const v=document.getElementById('toolProvider').value;S.toolProvider=v;if(v==='connected'){S.fixState ||= {};S.fixState.tool='configured';S.toolCheck='模拟连接检查通过；真实环境仍需证明已授权、可调用且工具返回格式正确。';}else if(v==='needsAuth'){S.toolCheck='账号需要重新授权：正式产品将在此打开 Astra Connection 授权组件，完成后回到原场景重试。';}else{S.toolCheck='未发现可用视频 Tool，可直接提交研发支持材料并附完整依赖清单。';S.devTicket=true;S.fixState.tool='developer';}}
else if(a==='previewUI'){S.previewUI=true;}
else if(a==='saveUI'){S.uiType=document.getElementById('uiType').value;S.fixState ||= {};S.fixState.ui='configured';message('已保存组件映射（原型）；需真实验证');}
else if(a==='runTrial'){S.case=Number(document.getElementById('trialCase').value);S.trialMessage='原型已演示调试步骤；真实 Astra Runtime 未执行，因此没有通过证据。请在开发版调用平台 Tool 并保存 Work Journal/Artifact 后复验。';}
else if(a==='viewEvidence'){S.showEvidence=!S.showEvidence;}
else if(a==='saveArtifact'){S.outputType=document.getElementById('outputType').value;S.fixState ||= {};S.fixState.artifact='configured';message('已保存成果规则（原型）');}
else if(a==='savePrice'){const price=Number(document.getElementById('salePrice').value);const cost=Number(document.getElementById('maxCost').value);if(!(price>0&&cost>0&&price>=cost)){message('请设置有效售价与成本上限，售价应不低于成本上限');return;}S.price=String(price);S.maxCost=String(cost);S.refund=document.getElementById('refundPolicy').value;S.fixState ||= {};S.fixState.pricing='configured';message('已保存计费规则（原型）');}
render();
});
document.addEventListener('input',function(ev){if(ev.target.dataset.field)S.data[S.app][ev.target.dataset.field]=ev.target.value;});
document.addEventListener('change',function(ev){const el=ev.target;if(el.id==='consent'){S.consent=el.checked;return}if(!el.dataset.upload||!el.files?.length)return;const f=el.files[0];if(el.dataset.upload==='skill'){S.uploaded=true;message('仅本地选择：'+f.name+'；不上传服务器')}else{S.data[S.app][el.dataset.upload]=f.name;message('已选择本地图片；不会上传')}render();});
const start=location.hash.replace('#','');if(['consumer','operator','stories','criteria'].includes(start))S.tab=start;render();
</script></body></html>
