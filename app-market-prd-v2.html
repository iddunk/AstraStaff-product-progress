<style>

8px #2633530b}.card{padding:23px}.window{overflow:hidden}.head{padding:11px 17px;border-bottom:1px solid var(--line);color:#8d98ae;font-size:11px;background:#fbfcff;display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:#d0d8e7}.body{padding:19px}.pill{display:inline-flex;align-items:center;border-radius:30px;padding:4px 10px;background:#eef0ff;color:#4253be;font-size:11px;font-weight:750}.pill.warn{background:#fff3de;color:#926018}.pill.ok{background:#e4f8ef;color:#267355}.sub{color:var(--dim);font-size:12px}.btn{border:1px solid #dfe5f2;background:white;border-radius:11px;padding:10px 14px;min-height:41px;color:#4d5b77;font-weight:750;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 7px 13px #4557da28}.btn.soft{background:#f5f6fc}.btn.green{background:#ebf9f0;border-color:#b7e7cf;color:#197351}.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #c2c9ff;outline-offset:1px}.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.stack{display:grid;gap:11px}.rule{height:1px;background:var(--line);margin:16px 0}.sideitem{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fdfdff;margin-top:10px}.sideitem b{font-size:13px}.sideitem p{font-size:12px;margin:6px 0 0;color:var(--dim)}.notice{padding:12px 13px;border-radius:12px;background:#fff8e9;color:#865f24;border:1px solid #f0e4cb;font-size:12px}.notice.blue{background:#f4f5ff;border-color:#e1e5ff;color:#5060a1}.notice.ok{background:#ebfaf1;border-color:#d4eede;color:#216f4b}.steps{display:flex;gap:6px;flex-wrap:wrap;margin:17px 0}.step{border-radius:10px;padding:7px 10px;background:#f3f5fa;font-weight:700;color:#8a95a9;font-size:11px}.step.active{background:#e9ecff;color:#4051c9}.step.done{background:#e5f7ed;color:#23724e}.hero{border-radius:16px;background:linear-gradient(120deg,#edf1ff,#f5f4ff);padding:20px;display:flex;align-items:center;justify-content:space-between;margin:12px 0 15px}.hero h3{font-size:21px;margin:5px 0;letter-spacing:-.6px}.hero p{font-size:12px;color:#71809f;margin:0}.app{width:100%;display:flex;align-items:center;gap:14px;padding:15px;text-align:left;border:1px solid var(--line);border-radius:15px;background:#fff;cursor:pointer}.app:hover{border-color:#a8b1f0;background:#fbfbff}.appicon{width:51px;height:51px;border-radius:15px;background:#eff0ff;display:grid;place-items:center;font-size:27px;flex:none}.app b{display:block;font-size:14px}.app p{margin:4px 0 0;color:var(--dim);font-size:12px}.app em{display:block;font-size:10px;color:var(--blue);font-style:normal;margin-top:7px}.field{padding:14px;border:1px solid var(--line);border-radius:15px;margin:10px 0}.field b{font-size:13px}.field small{display:block;font-size:11px;color:var(--dim);margin:4px 0 10px}.inp{width:100%;border:1px solid #dfe4f0;border-radius:11px;padding:11px 12px;background:white;color:var(--ink);min-height:41px}.inp.area{min-height:82px;resize:vertical}.file{display:block;text-align:center;background:#f7f8fe;border:1px dashed #a9b4dd;border-radius:11px;padding:16px;color:#5868ad;font-size:12px}.file input{display:block;width:100%;font-size:11px;margin-top:9px}.choice{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:11px;padding:9px 10px;margin:7px 0;font-size:12px}.choice.on{border-color:#9ba7ee;background:#f3f4ff}.consent{display:flex;gap:9px;color:#586581;font-size:12px;margin:14px 0;align-items:flex-start}.consent input{accent-color:var(--blue);margin-top:4px}.price{border:1px solid #dfe5fc;background:#f4f6ff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;margin:13px 0}.price strong{color:#3f4cc0;font-size:16px}.stage{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:13px;margin-top:9px}.stage i{width:32px;height:32px;border-radius:10px;background:#edf0ff;display:grid;place-items:center;color:#5b6acc;font-weight:800;font-style:normal}.stage b{font-size:12px}.stage small{display:block;color:var(--dim);font-size:11px}.video{background:linear-gradient(135deg,#1b2543,#6069a6);height:225px;border-radius:16px;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;gap:10px}.face{width:91px;height:91px;border-radius:50%;border:3px solid #ffffff33;background:#ffffff16;display:grid;place-items:center;font-size:53px}.watermark{position:absolute;top:11px;right:11px;font-size:10px;background:#ffffff33;padding:4px 7px;border-radius:30px}.opbtn{display:flex;gap:12px;width:100%;text-align:left;align-items:center;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;margin:8px 0}.opbtn.active{border-color:#929ff1;background:#f4f5ff}.opnum{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:#eef0ff;color:#4055cb;font-weight:800}.opbtn b{font-size:13px;display:block}.opbtn small{display:block;font-size:11px;color:var(--dim)}.scenario{width:100%;text-align:left;border:1px solid var(--line);padding:11px 12px;border-radius:11px;background:#fff;font-size:12px;margin:4px 0}.scenario.on{background:#eef1ff;border-color:#8797ed}.gate{border:1px solid var(--line);padding:12px;border-radius:12px;margin:9px 0}.gate b{font-size:12px}.gate p{font-size:12px;color:var(--dim);margin:5px 0}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{border:1px solid var(--line);padding:13px;border-radius:13px}.stat strong{font-size:21px;color:var(--blue);display:block}.stat span{font-size:11px;color:var(--dim)}.story{background:white;border:1px solid var(--line);border-radius:15px;padding:18px;margin-top:11px}.story h3{font-size:15px;margin:7px 0}.story p{font-size:12px;color:var(--dim);margin:5px 0}.rubric{width:100%;border-collapse:collapse;font-size:12px}.rubric td,.rubric th{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}.rubric th{background:#f6f7fe;color:#677493}.footer{border-top:1px solid var(--line);padding-top:18px;margin-top:46px;color:#919bb0;font-size:11px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#263353;color:#fff;padding:12px 15px;border-radius:11px;box-shadow:0 8px 30px #1726443b;font-size:12px;z-index:15;display:none;max-width:90%}.toast.show{display:block}
@media(max-width:880px){.grid{grid-template-columns:1fr}.top-inner{padding:10px 13px;gap:8px}.nav{width:100%;overflow-x:auto;justify-content:space-between}.nav button{flex:1;padding:8px 5px;font-size:11px}.version{margin-left:auto}.card{padding:17px}main{padding:23px 13px 50px}.body{padding:13px}.hero{padding:15px}.hero h3{font-size:18px}.three{grid-template-columns:1fr}.title{font-size:30px}}@media(max-width:380px){.nav button{font-size:10px}.brand{font-size:17px}.version{font-size:10px}}
</style></head>
<body><header class="topbar"><div class="top-inner"><div class="brand"><span class="glyph">✦</span>Astra <small>APP MARKET</small></div><span class="version">产品体验 PRD V2.0 · 待审核</span><nav class="nav" id="nav"><button data-tab="consumer">消费者体验</button><button data-tab="operator">运营调试工坊</button><button data-tab="stories">用户故事</button><button data-tab="criteria">上架验收</button></nav></div></header>
<main><div id="view"></div><div class="footer">Astra App Market · V2.0 · 2026-10-31 · 本网页所有生成、价格、工具、录音、评测、订单均为交互模拟，非生产能力声明。不会调用任何生产 API。</div></main><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const APPS={
  video:{name:'定制照片口播视频',emoji:'🎬',desc:'给一张照片、一段声音、一段话，让人物自然口播',price:'¥19.9 / 次（示例）',fields:[{id:'portrait',type:'image',label:'一张人物照片',hint:'正面清晰；可拍照或从相册选',required:true},{id:'voice',type:'voice',label:'声音',hint:'默认系统音色；定制本人音色需要授权及实际质量检测',required:true},{id:'script',type:'script',label:'口播脚本',hint:'输入内容或让 AI 帮忙起草',required:true}],consent:true},
  copy:{name:'商品卖点文案',emoji:'✍️',desc:'填入商品事实，生成可修改的卖点文案',price:'¥3.9 / 次（示例）',fields:[{id:'facts',type:'script',label:'商品真实信息',hint:'名称、用途、规格和禁用表述',required:true},{id:'audience',type:'text',label:'目标用户',hint:'选填：例如办公人群',required:false}],consent:false}
};
const CASES=[
['完整流程','照片/声音/脚本 → 平台组件取值 → Tool 执行 → 视频 Artifact → 可下载','未跑通平台真实外部视频工具'],
['缺少素材','用户缺一项时，只补问缺项并保留已填写内容','需用动态 Skill UI 实测缺项恢复'],
['授权不足','无肖像/声音使用权时明确拒绝，无实质生成与扣费','真实权限与授权校验尚待对接'],
['工具失败','超时/低质量可查看原因、重试，权益按规则返还','须真实工具失败演练和记录'],
['成本交付','上游成本可归集，用户售价可见，成功可下载、失败可返还','权益与 Artifact 商业闭环尚待验收']
];
let S={tab:'consumer',app:'video',screen:'list',data:{video:{voice:'system'},copy:{}},consent:false,edit:0,op:0,uploaded:false,case:0,played:false,issue:false};
const root=document.getElementById('view');
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function button(action,text,cls,extra){return '<button type="button" data-action="'+action+'" class="btn '+(cls||'')+'" '+(extra||'')+'>'+text+'</button>';}
function message(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(message.timer);message.timer=setTimeout(()=>el.classList.remove('show'),3000);}
function render(){document.querySelectorAll('[data-tab]').forEach(n=>n.classList.toggle('active',n.dataset.tab===S.tab));root.innerHTML=S.tab==='consumer'?consumer():S.tab==='operator'?operator():S.tab==='stories'?stories():criteria();}
function consumer(){
 const cap=APPS[S.app],v=S.data[S.app],screen=S.screen;
 let inner='';
 if(screen==='list'){
  inner='<div class="hero"><div><span class="kicker">发现好用的数字员工</span><h3>选一件你想完成的事</h3><p>不用先写 Prompt，打开就能做。</p></div><span style="font-size:40px">✨</span></div><div class="stack">'+Object.keys(APPS).map(k=>'<button type="button" class="app" data-action="choose" data-id="'+k+'"><span class="appicon">'+APPS[k].emoji+'</span><span><b>'+APPS[k].name+'</b><p>'+APPS[k].desc+'</p><em>只提供必要素材 → 自动完成 → 可修改</em></span><span style="margin-left:auto">›</span></button>').join('')+'</div>';
 }else if(screen==='form'){
  inner='<div class="row">'+button('backList','← 换一个应用','soft')+'</div><div class="hero"><div><span class="kicker">向导式任务组件</span><h3>'+cap.emoji+' '+cap.name+'</h3><p>缺什么补什么，不要求用户学会对话。</p></div></div>';
  inner+=cap.fields.map(f=>field(f,v)).join('');
  if(cap.consent)inner+='<label class="consent"><input id="consent" type="checkbox" '+(S.consent?'checked':'')+'><span>我确认有权使用上述照片与声音。若创建个人音色，须按照要求完成本人或权利人授权验证。</span></label>';
  inner+='<div class="price"><span>确认前显示本次价格和权益（模拟）</span><strong>'+cap.price+'</strong></div><div class="row">'+button('start','确认并开始制作 →','primary')+'</div><p class="sub">演示不调用麦克风、模型、支付或外部视频服务。</p>';
 }else if(screen==='running'){
  inner='<div class="hero"><div><span class="kicker">模拟生成中</span><h3>正在完成'+cap.name+'</h3><p>真实进度由 Work Journal / Tool evidence 回读，离开页面也可继续。</p></div>⏳</div>';
  inner+=['已接收素材（模拟）','平台 Skill 与 Tool 正在工作（演示）','成果待归档','权益将在真实规则下结算'].map((x,i)=>'<div class="stage"><i>'+(i+1)+'</i><div><b>'+x+'</b></div></div>').join('');
  inner+='<div class="row" style="margin-top:15px">'+button('finish','查看模拟结果 →','primary')+button('edit','修改输入','soft')+'</div>';
 }else if(screen==='result'){
  inner='<div class="row">'+button('edit','← 修改素材','soft')+'</div><div class="hero"><div><span class="kicker">成果页</span><h3>输出可以直接修改</h3><p>结果应可回看、可下载、可继续交代修改。</p></div></div>';
  inner+='<div class="video"><span class="watermark">Demo · 非真实视频</span><div class="face">'+(S.app==='video'?'👩':'📝')+'</div><small>这里应呈现真实成果 Artifact</small></div>';
  inner+='<div class="field"><b>成果内容与再编辑</b><small>直接编辑，也可以向员工描述想要的变化。</small><textarea id="editedText" class="inp area">'+esc(v.script||v.facts||'')+'</textarea></div><div class="row">'+button('redo','按修改重新制作','primary')+button('download','下载演示说明','soft')+button('restart','再做一次','soft')+'</div><div class="notice" style="margin-top:12px">这是 UI 模拟，不代表已生成视频或已扣费。真实发布必须能验证视频文件、成本、历史与失败返还。</div>';
 }
 const order=screen==='list'?0:screen==='result'?2:1;
 return '<div class="kicker">Astra App Market / consumer</div><h1 class="title">让用户做成事情，<br>而不是教用户提问。</h1><p class="intro">主交互是“应用卡片 → 必需输入 → 成果”，对话负责答疑、补全和修改；不为每个行业硬编码独立表单。</p><div class="grid"><aside class="card"><span class="pill">统一规则 · Capability UI Contract</span><h2 style="font-size:18px;margin:15px 0 5px">任务优先，对话辅助</h2><p class="sub">这套演示从两份能力 Schema 生成不同输入组件，底层仍是 Astra Employee / Skill / Tool / Artifact。</p><div class="steps">'+['选应用','提供素材','拿到成果'].map((x,i)=>'<span class="step '+(order===i?'active':order>i?'done':'')+'">'+(i+1)+' '+x+'</span>').join('')+'</div><div class="sideitem"><b>首次体验：自动生成输入卡片</b><p>口播视频是照片、音色、脚本；其他应用由自身的 Schema 产生字段，不套统一聊天框。</p></div><div class="sideitem"><b>遇到缺输入：只询问当前缺项</b><p>不重复收集资料，素材可复用，输入卡片可来自 Agent 当前分析。</p></div><div class="sideitem"><b>交付后：局部修改 + 语音/文字沟通</b><p>编辑文案后重新生成，也可说“讲得活泼一点”。只有实际视频、文本或表格 Artifact 才算成功。</p></div><div class="notice" style="margin-top:13px">“读一句话拿音色”是目标交互，不保证单句必然足够。录音不合格时智能提示补录，并完成明确授权。</div></aside><section class="window"><div class="head"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span style="margin-left:auto">消费者手机模拟 · 可点击</span></div><div class="body">'+inner+'</div></section></div>';
}
function field(f,v){
 let control='';
 if(f.type==='image')control='<label class="file">📷 '+(v[f.id]?'已选择：'+esc(v[f.id]):'点此拍照 / 从相册选择')+'<input type="file" accept="image/*" data-upload="'+f.id+'" aria-label="选择人物照片"></label>';
 else if(f.type==='voice')control='<div class="choice '+(v.voice==='system'?'on':'')+'"><span>🔊 平台标准音色</span>'+button('preset','选择','soft')+'</div><div class="choice '+(v.voice==='sample'?'on':'')+'"><span>🎙️ 我的授权音色</span>'+button('record','模拟录制','soft')+'</div>'+(v.voice==='sample'?'<span class="pill ok">演示音色已选择 · 未真实录音</span>':'')+'<div class="sub" style="margin-top:9px">实际产品在这里请求麦克风权限、验证授权和音频质量，不上传无授权声音。</div>';
 else if(f.type==='script')control='<textarea data-field="'+f.id+'" class="inp area" placeholder="输入想说的话或商品事实">'+esc(v[f.id]||'')+'</textarea><div class="row" style="margin-top:7px">'+button('suggest','✨ 帮我写一段','soft')+'</div>';
 else control='<input data-field="'+f.id+'" class="inp" placeholder="选填" value="'+esc(v[f.id]||'')+'">';
 return '<div class="field"><b>'+f.label+(f.required?' <span style="color:#bf8226">*</span>':'')+'</b><small>'+f.hint+'</small>'+control+'</div>';
}
function operator(){
 const steps=['导入一个 Skill','像消费者一样试','确认能否上架'];
 let inner='';
 if(S.op===0){
 inner='<span class="pill">01 / 自动理解</span><h2>上传 Skill，平台自动整理出应用</h2><p class="sub">解析 SKILL.md / references / assets、工具依赖、输入输出、限制与成本。技术性检查尽量在后台完成，未知时才问运营。</p><label class="file" style="margin:15px 0">⬆ 选择候选 Skill 包（演示）<input type="file" accept=".json,.zip,.md" data-upload="skill"></label><div class="row">'+button('load','载入示例 Skill','primary')+'</div>';
 if(S.uploaded)inner+='<div class="rule"></div>'+[['识别的目标','生成照片口播视频'],['用户输入','人物照片 · 声音 · 脚本'],['Astra 动态组件','图片上传 · 音色授权 · 文本输入'],['预期结果','可预览、可下载的视频'],['需要调试','平台 Tool 权限、视频生成、Artifact、失败重试']].map((x,i)=>'<div class="stage"><i>'+(i+1)+'</i><div><b>'+x[0]+'</b><small>'+x[1]+'</small></div></div>').join('')+'<div class="row" style="margin-top:14px">'+button('debug','进入真实体验调试 →','primary')+'</div>';
 }else if(S.op===1){
 inner='<span class="pill">02 / 真实工作流</span><h2>调试完整 Skill，不是只检查 Prompt</h2><p class="sub">平台依 Skill 流程生成默认评测用例；调试中调用 Astra 原生 Skill UI、Tool、Connection、Permission、Work Journal、Artifact。</p><div class="steps">'+['源 Skill','生成 UI','绑定工具','实际运行','核验结果'].map((x,i)=>'<span class="step '+(i===2?'active':'')+'">'+(i+1)+' '+x+'</span>').join('')+'</div><div class="notice blue">本地 Hermes 没有 Astra 的 Skill 组件、Tool 和授权上下文，所以只靠 Hermes 本地通过不能证明可上架。</div><h3 style="font-size:13px;margin-top:16px">系统生成的调试场景（点击查看）</h3>'+CASES.map((c,i)=>'<button type="button" class="scenario '+(S.case===i?'on':'')+'" data-action="case" data-index="'+i+'">'+(i+1)+'. '+c[0]+'</button>').join('')+'<div class="gate"><b>'+CASES[S.case][0]+'</b><p>'+CASES[S.case][1]+'</p><span class="pill warn">待真实验证</span><p>当前阻塞：'+CASES[S.case][2]+'</p></div><div class="row">'+button('simulate','模拟运行这个场景','primary')+button('review','查看上架资格 →','soft')+'</div>'+(S.played?'<div class="notice" style="margin-top:12px">模拟 UI 流程已走通，但未产生实际工具、镜像身份或结果证据；不可因此标记评测通过。</div>':'');
 }else{
 inner='<span class="pill">03 / 发布资格</span><h2>只让运营处理真正的阻塞项</h2><p class="sub">业务人员看到“还差什么”，而不是几十个技术状态。检查项由平台从执行证据自动汇总，未达到门槛不可上架。</p>'+[['源包完整性和摘要','已支持静态检查',true],['平台 UI 与真实工作流','需要真实用户路径验收',false],['Tool/权限/第三方接入','需要可证明的授权与调用',false],['评测集、失败恢复','正常/错误/拒绝各场景取证',false],['成本、扣费、权益、成果','生成与交付两套证据',false]].map(x=>'<div class="gate"><b>'+x[0]+'</b><p>'+x[1]+'</p><span class="pill '+(x[2]?'ok':'warn')+'">'+(x[2]?'静态项可检查':'未满足真实上架资格')+'</span></div>').join('')+'<div class="row">'+button('blocked','正式上架（未开放）','primary','disabled')+button('fixes','查看最短修复路径','soft')+'</div>'+(S.issue?'<div class="notice" style="margin-top:11px">优先打通一条真实端到端：① Tool 连接授权 → ② Astra UI 输入/补全 → ③ 实际执行并交付 → ④ 失败/退款/成本验收 → ⑤ 正式发行。</div>':'');
 }
 return '<div class="kicker">Operations / experience before publish</div><h1 class="title">运营不是后台管理员，<br>而是应用的第一位用户。</h1><p class="intro">从原来的长表单发布审核，收敛为三个自然动作：导入、体验、上架。能自动检查的内容由平台内化，只把必要问题交给运营。</p><div class="grid"><aside class="card"><h2 style="font-size:18px;margin:0">应用调试工坊</h2><p class="sub">运营通过真实用户交互去调试能力，而不是手动配置一套新系统。</p>'+steps.map((x,i)=>'<button type="button" data-action="opstep" data-index="'+i+'" class="opbtn '+(S.op===i?'active':'')+'"><span class="opnum">'+(i+1)+'</span><span><b>'+x+'</b><small>'+['自动识别内容与依赖','Skill UI + 平台真实执行','自动门禁与最少待处理项'][i]+'</small></span><span style="margin-left:auto">›</span></button>').join('')+'<div class="notice" style="margin-top:15px">当前生产应用市场 PR #1302 仅实现候选导入、保存、安全子集试运行。图中完整视频调试和上架尚未完成，不能冒充生产事实。</div></aside><section class="card">'+inner+'</section></div>';
}
function stories(){
 const arr=[['C01 · 发现应用','从直播/H5进入应用详情，不需懂 Agent。查看效果样例、价格、素材要求和不支持的情况。','首屏可直接进入任务卡片，登录只在必要时出现。'],['C02 · 提交素材','选择照片、声音和脚本；支持 AI 写稿、本人授权音色与素材补录。','缺任何一项只补该项；样本不足不伪称完成。'],['C03 · 预览交付','确认费用后看真实状态；可播放、可下载、可编辑并再次生成。','没有 Artifact、送达凭证与权益对账不算成功。'],['O01 · 导入 Skill','上传 Hermes 标准 Skill 和可声明依赖，由平台生成输入输出契约、Tool 需求及 UI。','自动检查安全/完整性，疑难项才请运营补充。'],['O02 · 真实调试','系统从完整流程生成正常、缺输入、拒绝授权、工具失败、重复提交等场景。','必须在 Astra Runtime、UI 和 Tool 路径执行并存证。'],['O03 · 发行与回滚','从通过验收的候选制作自营商品，再通过现有 V3 发布治理上架。','不可变版本，升级可灰度/回滚，消费者进行中的任务不暗中切换。']];
 return '<div class="kicker">PRD / user stories</div><h1 class="title">围绕结果定义故事，<br>不是围绕按钮定义功能。</h1><p class="intro">每个用户故事都需要一个真实可验证的 Outcome，以及失败时用户接下来能做什么。</p>'+arr.map(x=>'<div class="story"><span class="pill">'+x[0]+'</span><h3>'+x[1]+'</h3><p>'+x[2]+'</p></div>').join('')+'<div class="notice blue" style="margin-top:14px">统一技术事实：Employee / Conversation / Work Journal / Artifact / Permission / Connection / Ontology；Tool/Runtime/Office 保持可替换 Port。消费应用是数字员工的轻量服务入口，不创建第二套 Agent/Skill Registry。</div>';
}
function criteria(){
 const rows=[['完整能力契约','源 Skill、依赖、Schema、Tool 调用、资源权限、成果规格完整。'],['平台适配','动态 Skill UI 与完整真实流程一致；授权、缺项、恢复交互可用。'],['运行可复现','通过 Astra Runtime 运行，有真实 Tool、Work Journal、Artifact 与版本身份。'],['负例与安全','授权拒绝、工具失败/超时、重复请求、肖像音色授权均真实演练。'],['商业闭环','有公开价格、成本上限、权益扣减/失败返还、订单和交付一致性。'],['发行治理','评测过门槛后才发行，版本不可变，支持灰度与回滚。']];
 return '<div class="kicker">Release admission / quality bar</div><h1 class="title">怎样才算可上架？</h1><p class="intro">看一条完整的真实用户工作证据链：输入 → 平台调用 → 成果交付 → 计费/退款。静态检查、模拟成功或本地 Hermes 通过都不能替代真实验收。</p><div class="card" style="overflow-x:auto"><table class="rubric"><thead><tr><th>验收维度</th><th>上线标准</th></tr></thead><tbody>'+rows.map(r=>'<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td></tr>').join('')+'</tbody></table></div><div class="card" style="margin-top:16px"><h2 style="margin:0 0 8px;font-size:18px">建议交付顺序</h2><div class="three"><div class="stat"><strong>M0</strong><span>平台 Skill UI / Tool 调试与完整评测集</span></div><div class="stat"><strong>M1</strong><span>一款真实应用的消费者任务向导与 Artifact 交付</span></div><div class="stat"><strong>M2</strong><span>支付、权益、售价与成本、退款闭环</span></div></div><p class="sub">第一款真实商品优先选择 Tool 稳定、成果可核验、成本可控的能力；照片口播视频先用于验证多模态产品体验，不等于视频能力已接通。</p></div>';
}
document.addEventListener('click',function(ev){
const b=ev.target.closest('[data-tab],[data-action]');if(!b)return;
if(b.dataset.tab){S.tab=b.dataset.tab;history.replaceState(null,'','#'+S.tab);render();scrollTo({top:0});return;}
const a=b.dataset.action;
if(a==='choose'){S.app=b.dataset.id;S.screen='form';S.consent=false}
else if(a==='backList')S.screen='list';
else if(a==='edit')S.screen='form';
else if(a==='preset')S.data[S.app].voice='system';
else if(a==='record'){S.data[S.app].voice='sample';message('仅模拟录音结果，不读取麦克风或上传音色')}
else if(a==='suggest'){S.data[S.app][S.app==='video'?'script':'facts']=S.app==='video'?'大家好，欢迎来到我的小店。今天为大家介绍这款适合日常使用的新品！':'手工陶瓷杯，容量300毫升，适合日常喝水使用。价格请以商品页为准。'}
else if(a==='start'){let v=S.data[S.app],f=APPS[S.app].fields.find(x=>x.required&&!v[x.id]);if(f){message('还差一步：'+f.label);return}if(APPS[S.app].consent&&!S.consent){message('请确认人物照片及声音的使用权');return}S.screen='running'}
else if(a==='finish')S.screen='result';
else if(a==='redo'){const x=document.getElementById('editedText');S.data[S.app][S.app==='video'?'script':'facts']=x.value;S.edit++;S.screen='running'}
else if(a==='restart')S.screen='form';
else if(a==='download'){const t='Astra PRD 模拟成果说明（非真实交付）\n'+APPS[S.app].name+'\n'+JSON.stringify(S.data[S.app],null,2);const u=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));const link=document.createElement('a');link.href=u;link.download='Astra-PRD-模拟说明.txt';link.click();setTimeout(()=>URL.revokeObjectURL(u),1500);message('已生成演示说明');return}
else if(a==='opstep')S.op=Number(b.dataset.index);
else if(a==='load'){S.uploaded=true;message('示例 Skill 已载入，非真实上传')}
else if(a==='debug')S.op=1;
else if(a==='case')S.case=Number(b.dataset.index);
else if(a==='simulate'){S.played=true;message('仅模拟调试界面，不产生真实运行证据')}
else if(a==='review')S.op=2;
else if(a==='fixes')S.issue=!S.issue;
render();
});
document.addEventListener('input',function(ev){if(ev.target.dataset.field)S.data[S.app][ev.target.dataset.field]=ev.target.value;});
document.addEventListener('change',function(ev){const el=ev.target;if(el.id==='consent'){S.consent=el.checked;return}if(!el.dataset.upload||!el.files?.length)return;const f=el.files[0];if(el.dataset.upload==='skill'){S.uploaded=true;message('仅本地选择：'+f.name+'；不上传服务器')}else{S.data[S.app][el.dataset.upload]=f.name;message('已选择本地图片；不会上传')}render();});
const start=location.hash.replace('#','');if(['consumer','operator','stories','criteria'].includes(start))S.tab=start;render();
</script></body></html>
